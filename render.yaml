services:
  - type: web
    name: smallest
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: recordings
      mountPath: /opt/render/project/src/data
      sizeGB: 1
